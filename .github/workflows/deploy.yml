name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you re-run a deploy from the Actions tab

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub → Settings → Secrets and variables → Actions (see README)."
            exit 1
          fi

      - name: Prepare database and secrets
        env:
          SECRETS_FILE: ${{ runner.temp }}/secrets.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/deploy-prep.mjs

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply jarvis --remote

      # Deploy first, then upload secrets: on the very first run the Worker doesn't exist yet,
      # and `deploy --secrets-file` tries to read the (non-existent) Worker's secrets and fails.
      - name: Deploy
        run: npx wrangler deploy

      - name: Upload secrets
        run: |
          if [ "$(cat "${{ runner.temp }}/secrets.json")" = "{}" ]; then
            echo "No secrets set in GitHub; skipping."
          else
            npx wrangler secret bulk "${{ runner.temp }}/secrets.json"
          fi

      - name: Clean up
        if: always()
        run: rm -f "${{ runner.temp }}/secrets.json"
