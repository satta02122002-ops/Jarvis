name: Test

# Deploys are done by Cloudflare's GitHub integration (Workers Builds) on every push to main.
# This workflow only checks that the code typechecks and the tests pass.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
